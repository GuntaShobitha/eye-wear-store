<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Optical Horizon Not Found · STACKLY</title>
  <meta name="description" content="The eyewear page or archive you are seeking has been relocated or is currently outside our optical focal length." />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .notfound-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 50% 40%, rgba(197, 160, 112, 0.12) 0%, transparent 65%),
                  var(--color-bg);
      position: relative;
      overflow: hidden;
    }

    .notfound-glitch-number {
      font-family: var(--font-display);
      font-size: clamp(8rem, 20vw, 16rem);
      font-weight: 700;
      line-height: 0.85;
      color: rgba(20, 19, 17, 0.08);
      position: relative;
      letter-spacing: -0.05em;
      user-select: none;
    }

    .notfound-floating-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: auto;
      animation: floatGlasses 6s ease-in-out infinite;
      filter: drop-shadow(0 20px 30px rgba(20, 19, 17, 0.15));
      z-index: 2;
    }

    .notfound-content-card {
      position: relative;
      z-index: 3;
      max-width: 580px;
      margin-top: -2rem;
    }

    .notfound-content-card h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 1rem;
    }

    .notfound-content-card p {
      color: var(--color-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .notfound-actions {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- Page Loader -->
  <div id="page-loader" class="page-loader">
    <div class="loader-spinner"></div>
    <span class="loader-text">STACKLY · 404</span>
  </div>

  <div class="notfound-wrapper">
    <!-- Top Minimal Branding -->
    <div style="position: absolute; top: 2.5rem; left: 2.5rem; z-index: 10;">
      <a href="index.html" class="nav-logo">
        <img src="./images/logo-dark.webp" alt="STACKLY Logo" class="nav-logo-img" />
      </a>
    </div>

    <!-- Oversized 404 Typography with Floating 3D Eyewear Illustration -->
    <div class="notfound-glitch-number" aria-hidden="true">
      404
      <!-- Floating 3D Geometric Eyewear SVG -->
      <svg class="notfound-floating-frame" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Left Frame Rim (Mazzucchelli Havana style) -->
        <rect x="40" y="30" width="130" height="95" rx="35" stroke="#1C1917" stroke-width="12" fill="rgba(197, 160, 112, 0.25)" />
        <rect x="52" y="42" width="106" height="71" rx="24" fill="rgba(20, 19, 17, 0.65)" />
        <circle cx="105" cy="78" r="28" fill="rgba(255, 255, 255, 0.15)" />
        <!-- Right Frame Rim -->
        <rect x="230" y="30" width="130" height="95" rx="35" stroke="#1C1917" stroke-width="12" fill="rgba(197, 160, 112, 0.25)" />
        <rect x="242" y="42" width="106" height="71" rx="24" fill="rgba(20, 19, 17, 0.65)" />
        <circle cx="295" cy="78" r="28" fill="rgba(255, 255, 255, 0.15)" />
        <!-- High-Arch Bridge & Top Brow Bar -->
        <path d="M170 55 C185 45, 215 45, 230 55" stroke="#C5A070" stroke-width="8" stroke-linecap="round" />
        <path d="M170 75 C185 70, 215 70, 230 75" stroke="#1C1917" stroke-width="6" stroke-linecap="round" />
        <!-- Temples Hinges -->
        <line x1="28" y1="50" x2="40" y2="50" stroke="#C5A070" stroke-width="8" stroke-linecap="round" />
        <line x1="360" y1="50" x2="372" y2="50" stroke="#C5A070" stroke-width="8" stroke-linecap="round" />
        <path d="M28 50 L10 80" stroke="#1C1917" stroke-width="6" stroke-linecap="round" />
        <path d="M372 50 L390 80" stroke="#1C1917" stroke-width="6" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Main Message Card -->
    <div class="notfound-content-card">
      <span class="eyebrow">Out of Focal Range</span>
      <h1>Silhouette Not Located</h1>
      <p>
        The page, private monograph, or social destination you are attempting to reach has either been archived or is currently beyond our optical focal plane.
      </p>

      <div class="notfound-actions">
        <!-- Back to Home Button -->
        <a href="index.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Back to Home
        </a>

        <!-- Go Back Button with safe fallback -->
        <button onclick="window.STACKLY_MAIN.goBackSafe()" class="btn btn-outline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Go Back
        </button>

        <a href="collections.html" class="btn btn-gold">
          Explore Eyewear Archive
        </a>
      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
